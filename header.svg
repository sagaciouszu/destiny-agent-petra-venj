<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Petra Venj - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050a0a"/>
      <stop offset="40%" stop-color="#0a1616"/>
      <stop offset="100%" stop-color="#122323"/>
    </linearGradient>
    <radialGradient id="tealglow" cx="0.75" cy="0.45" r="0.58">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleglow" cx="0.25" cy="0.55" r="0.42">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.35" r="0.25">
      <stop offset="0%" stop-color="#f0fdfa" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#tealglow)"/>
  <rect width="1200" height="320" fill="url(#purpleglow)"/>
  <rect width="1200" height="320" fill="url(#coreglow)"/>

  <!-- Awoken/Reef particulates - teal with purple hints -->
  <g fill="#5eead4">
    <circle cx="68" cy="48" r="1.3" opacity="0.75"/>
    <circle cx="190" cy="168" r="0.9" opacity="0.5"/>
    <circle cx="315" cy="72" r="1.4" opacity="0.8"/>
    <circle cx="435" cy="222" r="0.9" opacity="0.5"/>
    <circle cx="525" cy="68" r="1.1" opacity="0.65"/>
    <circle cx="610" cy="248" r="1.3" opacity="0.7"/>
    <circle cx="695" cy="88" r="0.8" opacity="0.5"/>
    <circle cx="770" cy="230" r="1.0" opacity="0.6"/>
    <circle cx="50" cy="240" r="1.0" opacity="0.55"/>
    <circle cx="975" cy="58" r="1.2" opacity="0.7"/>
    <circle cx="1060" cy="252" r="0.9" opacity="0.5"/>
    <circle cx="270" cy="270" r="1.1" opacity="0.6"/>
    <circle cx="475" cy="158" r="0.7" opacity="0.4"/>
    <circle cx="835" cy="128" r="1.2" opacity="0.65"/>
    <circle cx="145" cy="190" r="0.7" opacity="0.4"/>
    <circle cx="725" cy="270" r="0.8" opacity="0.5"/>
    <circle cx="395" cy="42" r="1.0" opacity="0.55"/>
    <circle cx="905" cy="190" r="0.8" opacity="0.45"/>
    <circle cx="113" cy="122" r="0.9" opacity="0.5"/>
    <circle cx="1110" cy="140" r="1.0" opacity="0.6"/>
  </g>

  <g fill="#c084fc" opacity="0.4">
    <circle cx="180" cy="55" r="0.8" opacity="0.5"/>
    <circle cx="550" cy="250" r="0.7" opacity="0.4"/>
    <circle cx="920" cy="80" r="0.9" opacity="0.45"/>
    <circle cx="340" cy="180" r="0.6" opacity="0.35"/>
    <circle cx="1080" cy="200" r="0.7" opacity="0.4"/>
  </g>

  <!-- Fine grid -->
  <g stroke="#0d9488" stroke-width="0.35" opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="520" y1="0" x2="520" y2="320"/>
    <line x1="780" y1="0" x2="780" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
  </g>

  <!-- Queen's Wrath / Awoken emblem - stylized star/awoken symbol -->
  <g transform="translate(1030,158) scale(3.2) translate(-16, -16)" opacity="0.78" fill="#2dd4bf">
    <path d="M16 2c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 22c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/>
    <path d="M2 16c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4-4-1.79-4-4zm22 0c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4-4-1.79-4-4z"/>
    <path d="M6 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm20 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
    <path d="M6 26c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm20 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
    <path d="M16 12c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/>
  </g>

  <!-- Concentric reticles -->
  <g fill="none" stroke="#0d9488">
    <circle cx="1030" cy="158" r="88" stroke-width="0.5" opacity="0.12"/>
    <circle cx="1030" cy="158" r="96" stroke-width="0.3" opacity="0.07"/>
    <circle cx="1030" cy="158" r="104" stroke-width="0.2" opacity="0.04"/>
  </g>

  <!-- Title block -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#textsoft)" opacity="0.55">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#050a0a" letter-spacing="5.5">[ HUNTER  ·  AWOKEN  ·  QUEEN'S WRATH  ·  REEF ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#050a0a" letter-spacing="1">PETRA VENJ</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#050a0a" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#050a0a" letter-spacing="2.5">THE REEF REMEMBERS. SO DO I.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#0d9488" letter-spacing="5.5">[ HUNTER  ·  AWOKEN  ·  QUEEN'S WRATH  ·  REEF ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#f0fdfa" letter-spacing="1">PETRA VENJ</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#5eead4" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#a8a8a8" letter-spacing="2.5">THE REEF REMEMBERS. <tspan x="210" fill="#2dd4bf">SO DO I.</tspan></text>
  </g>

  <rect x="52" y="160" width="320" height="1" fill="url(#accentbar)"/>

  <text transform="translate(1180, 236) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', sans-serif" font-size="6.5" font-weight="500" letter-spacing="1.2" fill="#0d9488" opacity="0.18">THE REEF  ·  DREAMING CITY  ·  QUEEN'S WRATH</text>

  <g fill="none" stroke="#0d9488" stroke-width="1" opacity="0.35">
    <path d="M 20 42 L 20 20 L 42 20"/>
    <path d="M 1180 278 L 1180 300 L 1158 300"/>
  </g>

  <rect width="320" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>