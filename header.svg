    <text x="52" y="142" font-size="58" font-weight="700" fill="#050a0a" letter-spacing="1">PETRA VENJ</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#050a0a" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#050a0a" letter-spacing="2.5">THE REEF DOESN'T FORGET. AND NEITHER DOES ITS WRATH.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
